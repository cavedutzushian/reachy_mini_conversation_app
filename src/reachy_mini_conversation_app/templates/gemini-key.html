<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Reachy Mini · Gemini 金鑰設定</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/gemini-key.js"></script>
</head>
<body>
  <main class="app-shell__outlet">
    <section class="view view--settings">
      <header class="view-header">
        <h1 class="view-title">Gemini 金鑰設定</h1>
        <p class="view-subtitle">金鑰儲存在這台電腦目前使用者的受保護憑證庫，跨 App 重啟保留。</p>
      </header>
      <section class="settings-section">
        <h2 class="settings-section-title">目前設定</h2>
        <p id="credential-state" class="settings-hint" role="status" aria-live="polite">正在查詢…</p>
        <p id="credential-impact" class="settings-hint"></p>
        <form id="credential-form" class="settings-form">
          <label class="settings-field" for="credential-input">新的 Gemini API key
            <input id="credential-input" class="settings-input" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" aria-describedby="credential-privacy">
          </label>
          <p id="credential-privacy" class="settings-hint">不會顯示已儲存的金鑰。驗證只檢查所選模型的連線資格，不傳送對話、人格、音訊或工具。服務可能計入額度。</p>
          <div class="settings-actions credential-actions">
            <button id="credential-apply" class="btn btn--primary" type="submit" disabled>驗證並套用</button>
            <button id="credential-cancel" class="btn btn--ghost" type="button">取消編輯</button>
            <button id="credential-clear" class="btn btn--danger" type="button" disabled>清除設定頁金鑰</button>
          </div>
        </form>
        <p id="credential-result" class="settings-status" role="status" aria-live="polite"></p>
        <div class="settings-actions credential-actions">
          <button id="credential-refresh" class="btn btn--ghost" type="button">重新查詢狀態</button>
          <button id="credential-retry" class="btn btn--ghost" type="button" disabled>手動重新連線 Gemini</button>
          <a class="btn btn--ghost" href="/#/settings" rel="noreferrer">返回一般設定</a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
