<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachy VAD 監測</title>
  <style>
    body { font: 16px system-ui, sans-serif; background: #f4f5f7; color: #18212e; margin: 0; padding: 24px; }
    main { max-width: 720px; margin: auto; }
    section { background: white; border-radius: 14px; padding: 20px; margin: 16px 0; }
    h1 { margin-bottom: 8px; } p { color: #596579; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    dd { margin: 0; font-weight: 600; text-align: right; }
    progress { width: 100%; height: 24px; accent-color: #377fd2; }
    pre { white-space: pre-wrap; font: 14px ui-monospace, monospace; max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>即時 VAD 監測</h1>
  <p>唯讀診斷。應用程式須以 <code>--debug</code> 執行。</p>
  <section>
    <p id="connection">連線中…</p>
    <p id="microphone">正在檢查麥克風…</p>
    <h2>Silero 語音機率： <span id="probability">—</span></h2>
    <progress id="meter" max="1" value="0"></progress>
    <p>聆聽門檻為 0.50。插話門檻為 0.60，持續偵測到語音 384 ms 後確認。</p>
    <dl>
      <dt>本機 VAD 可用</dt><dd id="available">—</dd>
      <dt>偵測到本機語音</dt><dd id="local_speech">—</dd>
      <dt>偵測到服務端語音</dt><dd id="server_speech">—</dd>
      <dt>動作聆聽狀態</dt><dd id="listening">—</dd>
      <dt>可能插話</dt><dd id="barge_in_candidate">—</dd>
      <dt>播放振幅</dt><dd id="playback_gain">—</dd>
    </dl>
    <p id="last-update">正在等待 VAD 事件…</p>
  </section>
  <section>
    <h2>對話逐字稿</h2>
    <p>即時顯示使用者與機器人的完整對話。重新整理會清除此畫面。</p>
    <pre id="transcript">正在等待語音…</pre>
  </section>
  <section><h2>狀態變更</h2><pre id="events">等待中…</pre></section>
</main>
<script type="module">
  import { subscribe, rpcCall } from "./js/api.js";

  const fields = ["available", "local_speech", "server_speech", "listening",
    "barge_in_candidate", "playback_gain"];
  const labels = ["本機 VAD 可用", "本機語音", "服務端語音", "動作聆聽",
    "可能插話", "播放振幅"];
  const entries = [];
  let previous = null;
  let receivedAt = 0;
  const writeEvent = (text, timestamp) => {
    entries.unshift(`${new Date(timestamp).toLocaleTimeString()}  ${text}`);
    document.getElementById("events").textContent = entries.slice(0, 40).join("\n");
  };

  subscribe("conversation.vad", status => {
    receivedAt = Date.now();
    const probability = status.probability;
    document.getElementById("probability").textContent = probability == null ? "unavailable" : probability.toFixed(3);
    document.getElementById("meter").value = probability ?? 0;
    fields.forEach((field, index) => {
      const value = status[field];
      const label = field === "playback_gain" ? `${Math.round(value * 100)}%` : value ? "是" : "否";
      document.getElementById(field).textContent = label;
      if (previous && previous[field] !== value) writeEvent(`${labels[index]}: ${label}`, status.timestamp * 1000);
    });
    if (!previous) writeEvent("已收到第一筆本機 VAD 狀態", status.timestamp * 1000);
    previous = status;
  });
  subscribe("conversation.activity", status => {
    if (["user_speech_started", "user_speech_stopped"].includes(status.reason))
      writeEvent(status.reason, Date.now());
  });

  const transcriptTurns = [];
  subscribe("conversation.transcript", turn => {
    if (!turn.final || !turn.text?.trim()) return;
    const speaker = turn.role === "assistant" ? "機器人" : "使用者";
    transcriptTurns.push(`${new Date().toLocaleTimeString()}  ${speaker}\n${turn.text}`);
    if (transcriptTurns.length > 100) transcriptTurns.shift();
    const transcript = document.getElementById("transcript");
    const following = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 40;
    transcript.textContent = transcriptTurns.join("\n\n");
    if (following) transcript.scrollTop = transcript.scrollHeight;
  });

  setInterval(() => {
    document.getElementById("last-update").textContent = receivedAt
      ? `最近 VAD 更新：${Math.floor((Date.now() - receivedAt) / 1000)} 秒前`
      : "正在等待 VAD 事件。請確認已啟用偵錯日誌，且麥克風未靜音。";
  }, 1000);
  Promise.all([rpcCall("conversation.status"), rpcCall("conversation.mic")]).then(([status, mic]) => {
    document.getElementById("connection").textContent = status.backend_connected ? "對話已連線" : "對話已斷線";
    document.getElementById("microphone").textContent = mic.muted ? "麥克風已靜音，請在對話畫面取消靜音。" : "麥克風未靜音";
  }).catch(error => {
    document.getElementById("connection").textContent = `連線失敗：${error.message}`;
    console.error("VAD monitor connection failed", error);
  });
</script>
</body>
</html>
